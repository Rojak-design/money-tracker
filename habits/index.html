<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habits · Rojak</title>
  <meta name="description" content="Daily, weekly and monthly habits with streaks and completion. Data stays on your phone.">
  <meta name="theme-color" content="#6d28d9">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../rojak-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../rojak-apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- When app files change, bump ?v= here, in index.html, money/index.html, fitness/index.html and the version in sw.js (keep them all the same). -->
  <link rel="stylesheet" href="style.css?v=62">
</head>
<body>
  <header class="topbar">
    <a href="../" class="back-home">‹ Rojak</a>
    <h1>Habits</h1>
    <div id="todayLabel" class="muted small"></div>
  </header>

  <main>
    <div id="habits"></div>
  </main>

  <button id="fab" class="fab" aria-label="Add a habit">+</button>

  <!-- Bottom sheet for forms -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="../core/store.js?v=62"></script>
  <script src="rules.js?v=62"></script>
  <script src="engine.js?v=62"></script>
  <script src="app.js?v=62"></script>
</body>
</html>
