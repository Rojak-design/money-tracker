<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rojak</title>
  <meta name="description" content="Rojak — your everyday app: money tracker, and more to come. Data stays on your phone.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="rojak-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="rojak-apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rojak">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- When app files change, bump ?v= here, in money/index.html and the version in sw.js (keep them all the same). -->
  <link rel="stylesheet" href="core/home.css?v=25">
</head>
<body>
  <header class="home-top">
    <div id="avatar" class="avatar" aria-hidden="true"></div>
    <div>
      <h1>Rojak</h1>
      <div id="today" class="muted small"></div>
    </div>
  </header>

  <main>
    <!-- Money module: tap to open the money tracker -->
    <a class="card module-card" href="money/" id="moneyCard">
      <div class="module-head"><span class="module-icon">💰</span><h2>Money</h2><span class="open">Open ›</span></div>
      <div id="moneySummary" class="money-summary"><div class="muted small">Loading…</div></div>
    </a>

    <!-- Modules to be built later -->
    <div class="soon-grid">
      <div class="card soon"><span class="module-icon">🌱</span><h2>Habits</h2><div class="muted small">Coming soon</div></div>
      <div class="card soon"><span class="module-icon">💪</span><h2>Fitness</h2><div class="muted small">Coming soon</div></div>
      <div class="card soon"><span class="module-icon">📚</span><h2>Books / Music</h2><div class="muted small">Coming soon</div></div>
      <div class="card soon"><span class="module-icon">🗓️</span><h2>Scheduler</h2><div class="muted small">Coming soon</div></div>
    </div>

    <div class="card backup">
      <h2>💾 Backup</h2>
      <p class="muted small" id="backupInfo">Everything in Rojak is saved only on this phone. Keep a backup file somewhere safe.</p>
      <button class="btn" id="exportBtn">Export backup</button>
      <p class="muted small">To restore a backup, open Money → Backup → Import backup.</p>
    </div>

    <p id="hairNote" class="muted small center"></p>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="core/store.js?v=25"></script>
  <script src="core/avatar.js?v=25"></script>
  <script src="core/home.js?v=25"></script>
</body>
</html>
